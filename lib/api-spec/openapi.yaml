openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: site-content
    description: Public website content and protected admin editing
  - name: admin
    description: Admin sign-in and account management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /site-content:
    get:
      operationId: getSiteContent
      tags: [site-content]
      summary: Get the published website content
      responses:
        "200":
          description: Website content, or null before the first admin save
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContentSnapshot"
    put:
      operationId: updateSiteContent
      tags: [site-content]
      summary: Replace the website content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteContentWriteInput"
      responses:
        "200":
          description: Updated website content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteContentSnapshot"
        "400":
          description: Invalid website content
        "401":
          description: Admin sign-in required
        "403":
          description: Admin password change required
  /admin/status:
    get:
      operationId: getAdminStatus
      tags: [admin]
      summary: Get the current admin session state
      responses:
        "200":
          description: Current session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /admin/images:
    post:
      operationId: uploadAdminImage
      tags: [admin]
      summary: Upload a public site image to Supabase Storage
      description: Accepts an image binary and stores it in the site's public image bucket.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          image/avif:
            schema: { type: string, format: binary }
          image/gif:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Uploaded public image URL and storage path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImageUploadResponse"
        "400":
          description: Empty or invalid image
        "401":
          description: Admin sign-in required
        "403":
          description: Admin password change required or request origin is not allowed
        "413":
          description: Image exceeds the upload size limit
        "415":
          description: Unsupported image type
        "502":
          description: Supabase Storage upload failed
        "503":
          description: Supabase Storage is not configured
  /admin/login:
    post:
      operationId: loginAdmin
      tags: [admin]
      summary: Sign in to the admin area
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Credentials were not accepted
        "429":
          description: Too many sign-in attempts
        "503":
          description: Admin password is not configured
  /admin/logout:
    post:
      operationId: logoutAdmin
      tags: [admin]
      summary: End the current admin session
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLogoutResponse"
  /admin/password:
    post:
      operationId: changeAdminPassword
      tags: [admin]
      summary: Change the admin password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPasswordChangeInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          description: Password does not meet the requirements
        "401":
          description: Admin sign-in required
  /admin/mailbox:
    get:
      operationId: getAdminMailbox
      tags: [admin]
      summary: Get the connected company mailbox
      responses:
        "200":
          description: Mailbox status without credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMailbox"
        "401":
          description: Admin sign-in required
    post:
      operationId: connectAdminMailbox
      tags: [admin]
      summary: Connect a Go45 IMAP and SMTP mailbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMailboxConnectInput"
      responses:
        "200":
          description: Connected mailbox status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMailbox"
        "400":
          description: Invalid mailbox settings
        "401":
          description: Admin sign-in required
        "502":
          description: Mailbox could not be verified
    delete:
      operationId: disconnectAdminMailbox
      tags: [admin]
      summary: Disconnect the company mailbox
      responses:
        "200":
          description: Mailbox disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMailboxDisconnectResponse"
        "401":
          description: Admin sign-in required
  /admin/mailbox/messages:
    get:
      operationId: listAdminMailboxMessages
      tags: [admin]
      summary: List recent inbox messages
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 30 }
      responses:
        "200":
          description: Recent inbox messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMailboxMessageList"
        "401":
          description: Admin sign-in required
        "503":
          description: No mailbox is connected
        "502":
          description: Inbox could not be loaded
  /admin/mailbox/messages/{uid}:
    get:
      operationId: getAdminMailboxMessage
      tags: [admin]
      summary: Read one inbox message
      parameters:
        - in: path
          name: uid
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Message details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMailboxMessageDetail"
        "401":
          description: Admin sign-in required
        "404":
          description: Message not found
        "503":
          description: No mailbox is connected
        "502":
          description: Message could not be loaded
  /admin/mailbox/send:
    post:
      operationId: sendAdminMailboxMessage
      tags: [admin]
      summary: Send or reply from the company mailbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMailboxSendInput"
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMailboxSendResponse"
        "400":
          description: Invalid message
        "401":
          description: Admin sign-in required
        "503":
          description: No mailbox is connected
        "502":
          description: Email could not be sent
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    NavItem:
      type: object
      additionalProperties: false
      properties:
        label: { type: string }
        href: { type: string }
      required: [label, href]
    HeroSlide:
      type: object
      additionalProperties: false
      properties:
        eyebrow: { type: string }
        headlineFirst: { type: string }
        headlineSecond: { type: string }
        description: { type: string }
        image: { type: string }
      required: [eyebrow, headlineFirst, headlineSecond, description, image]
    ServiceItem:
      type: object
      additionalProperties: false
      properties:
        title: { type: string }
        kicker: { type: string }
        description: { type: string }
        image: { type: string }
      required: [title, kicker, description, image]
    ProjectItem:
      type: object
      additionalProperties: false
      properties:
        title: { type: string }
        category: { type: string }
        location: { type: string }
        description: { type: string }
        image: { type: string }
        illustrative: { type: boolean }
      required: [title, category, location, description, image, illustrative]
    ApproachStep:
      type: object
      additionalProperties: false
      properties:
        number: { type: string }
        title: { type: string }
        copy: { type: string }
      required: [number, title, copy]
    PartnerItem:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        logo: { type: string }
        url: { type: string }
      required: [name, logo, url]
    SiteContent:
      type: object
      additionalProperties: false
      properties:
        brand:
          type: object
          additionalProperties: false
          properties:
            companyName: { type: string }
            tagline: { type: string }
            logoPath: { type: string }
          required: [companyName, tagline, logoPath]
        navigation:
          type: array
          items: { $ref: "#/components/schemas/NavItem" }
        headerCta: { type: string }
        hero:
          type: object
          additionalProperties: false
          properties:
            locationLabel: { type: string }
            watermark: { type: string }
            footerLabel: { type: string }
            primaryCta: { type: string }
            secondaryCta: { type: string }
            pauseLabel: { type: string }
            playLabel: { type: string }
            slides:
              type: array
              items: { $ref: "#/components/schemas/HeroSlide" }
          required: [locationLabel, watermark, footerLabel, primaryCta, secondaryCta, pauseLabel, playLabel, slides]
        about:
          type: object
          additionalProperties: false
          properties:
            eyebrow: { type: string }
            leftNote: { type: string }
            titleFirst: { type: string }
            titleSecond: { type: string }
            body: { type: string }
            supportingCopy: { type: string }
            cta: { type: string }
          required: [eyebrow, leftNote, titleFirst, titleSecond, body, supportingCopy, cta]
        services:
          type: object
          additionalProperties: false
          properties:
            eyebrow: { type: string }
            title: { type: string }
            titleEmphasis: { type: string }
            note: { type: string }
            items:
              type: array
              items: { $ref: "#/components/schemas/ServiceItem" }
          required: [eyebrow, title, titleEmphasis, note, items]
        businesses:
          type: object
          additionalProperties: false
          properties:
            eyebrow: { type: string }
            title: { type: string }
            titleEmphasis: { type: string }
            items:
              type: array
              items: { $ref: "#/components/schemas/ServiceItem" }
          required: [eyebrow, title, titleEmphasis, items]
        projects:
          type: object
          additionalProperties: false
          properties:
            eyebrow: { type: string }
            title: { type: string }
            titleEmphasis: { type: string }
            note: { type: string }
            items:
              type: array
              items: { $ref: "#/components/schemas/ProjectItem" }
          required: [eyebrow, title, titleEmphasis, note, items]
        approach:
          type: object
          additionalProperties: false
          properties:
            eyebrow: { type: string }
            title: { type: string }
            titleEmphasis: { type: string }
            intro: { type: string }
            steps:
              type: array
              items: { $ref: "#/components/schemas/ApproachStep" }
          required: [eyebrow, title, titleEmphasis, intro, steps]
        partners:
          type: object
          additionalProperties: false
          properties:
            eyebrow: { type: string }
            title: { type: string }
            titleEmphasis: { type: string }
            note: { type: string }
            emptyMessage: { type: string }
            items:
              type: array
              items: { $ref: "#/components/schemas/PartnerItem" }
          required: [eyebrow, title, titleEmphasis, note, emptyMessage, items]
        values:
          type: object
          additionalProperties: false
          properties:
            eyebrow: { type: string }
            title: { type: string }
            titleEmphasis: { type: string }
            intro: { type: string }
            items:
              type: array
              items: { type: string }
          required: [eyebrow, title, titleEmphasis, intro, items]
        leadership:
          type: object
          additionalProperties: false
          properties:
            eyebrow: { type: string }
            title: { type: string }
            titleEmphasis: { type: string }
            name: { type: string }
            role: { type: string }
            portraitUrl: { type: string }
            statement: { type: string }
          required: [eyebrow, title, titleEmphasis, name, role, portraitUrl, statement]
        contact:
          type: object
          additionalProperties: false
          properties:
            eyebrow: { type: string }
            headline: { type: string }
            email: { type: string }
            phone: { type: string }
            location: { type: string }
            socialHandle: { type: string }
            socialUrl: { type: string }
            cta: { type: string }
          required: [eyebrow, headline, email, phone, location, socialHandle, socialUrl, cta]
        footer:
          type: object
          additionalProperties: false
          properties:
            tagline: { type: string }
            navigateLabel: { type: string }
            contactLabel: { type: string }
          required: [tagline, navigateLabel, contactLabel]
      required: [brand, navigation, headerCta, hero, about, services, businesses, projects, approach, partners, values, leadership, contact, footer]
    SiteContentWriteInput:
      type: object
      additionalProperties: false
      properties:
        content: { $ref: "#/components/schemas/SiteContent" }
      required: [content]
    SiteContentSnapshot:
      type: object
      additionalProperties: false
      properties:
        content:
          oneOf:
            - $ref: "#/components/schemas/SiteContent"
            - type: "null"
        updatedAt:
          type: ["string", "null"]
          format: date-time
      required: [content, updatedAt]
    AdminLoginInput:
      type: object
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
      required: [username, password]
    AdminPasswordChangeInput:
      type: object
      additionalProperties: false
      properties:
        newPassword: { type: string, minLength: 12 }
      required: [newPassword]
    AdminSession:
      type: object
      additionalProperties: false
      properties:
        authenticated: { type: boolean }
        username:
          oneOf:
            - type: string
            - type: "null"
        mustChangePassword: { type: boolean }
      required: [authenticated, username, mustChangePassword]
    AdminLogoutResponse:
      type: object
      additionalProperties: false
      properties:
        success: { type: boolean }
      required: [success]
    AdminImageUploadResponse:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, format: uri }
        path: { type: string }
      required: [url, path]
    AdminMailbox:
      type: object
      additionalProperties: false
      properties:
        connected: { type: boolean }
        email: { type: ["string", "null"], format: email }
        imapHost: { type: ["string", "null"] }
        imapPort: { type: ["integer", "null"] }
        smtpHost: { type: ["string", "null"] }
        smtpPort: { type: ["integer", "null"] }
        connectedAt: { type: ["string", "null"], format: date-time }
      required: [connected, email, imapHost, imapPort, smtpHost, smtpPort, connectedAt]
    AdminMailboxConnectInput:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 1024 }
        imapHost: { type: string, minLength: 1, maxLength: 253 }
        imapPort: { type: integer, enum: [993, 143] }
        smtpHost: { type: string, minLength: 1, maxLength: 253 }
        smtpPort: { type: integer, enum: [465, 587] }
      required: [email, password, imapHost, imapPort, smtpHost, smtpPort]
    AdminMailboxDisconnectResponse:
      type: object
      additionalProperties: false
      properties:
        success: { type: boolean }
      required: [success]
    AdminMailboxMessageSummary:
      type: object
      additionalProperties: false
      properties:
        uid: { type: integer, minimum: 1 }
        from: { type: string }
        fromName: { type: ["string", "null"] }
        to: { type: string }
        subject: { type: string }
        date: { type: ["string", "null"], format: date-time }
        preview: { type: string }
        unread: { type: boolean }
      required: [uid, from, fromName, to, subject, date, preview, unread]
    AdminMailboxMessage:
      allOf:
        - $ref: "#/components/schemas/AdminMailboxMessageSummary"
        - type: object
          additionalProperties: false
          properties:
            bodyText: { type: string }
            messageId: { type: ["string", "null"] }
          required: [bodyText, messageId]
    AdminMailboxMessageList:
      type: object
      additionalProperties: false
      properties:
        connected: { type: boolean }
        email: { type: ["string", "null"], format: email }
        messages:
          type: array
          items: { $ref: "#/components/schemas/AdminMailboxMessageSummary" }
      required: [connected, email, messages]
    AdminMailboxMessageDetail:
      type: object
      additionalProperties: false
      properties:
        message: { $ref: "#/components/schemas/AdminMailboxMessage" }
      required: [message]
    AdminMailboxSendInput:
      type: object
      additionalProperties: false
      properties:
        to: { type: string, format: email }
        subject: { type: string, minLength: 1, maxLength: 250 }
        text: { type: string, minLength: 1, maxLength: 30000 }
        replyToUid: { type: integer, minimum: 1 }
      required: [to, subject, text]
    AdminMailboxSendResponse:
      type: object
      additionalProperties: false
      properties:
        success: { type: boolean }
        recipient: { type: string, format: email }
        sentAt: { type: string, format: date-time }
      required: [success, recipient, sentAt]

